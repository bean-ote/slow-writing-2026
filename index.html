gt;','"':'&quot;',"'":'&#39;'}[c]));const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());let dates=[];for(let n=0;n<62;n++){let d=new Date(Date.UTC(2026,9,31+n));dates.push(d.toISOString().slice(0,10))}const total=id=>Object.values(data.records).filter(a=>a.includes(id)).length;
function render(){let ds=dates,ps=data.participants.filter(p=>p.name.toLowerCase().includes($('search').value.toLowerCase()));if($('sort').value==='total')ps.sort((a,b)=>total(b.id)-total(a.id)||a.name.localeCompare(b.name,'ko'));if($('sort').value==='name')ps.sort((a,b)=>a.name.localeCompare(b.name,'ko'));let groups=[];ds.forEach(d=>{let m=+d.slice(5,7),g=groups.at(-1);if(g?.m===m)g.n++;else groups.push({m,n:1})});let totals=data.participants.map(p=>total(p.id));$('table').innerHTML=`<colgroup><col class="rank"><col class="name"><col class="sum">${ds.map(()=>'<col>').join('')}</colgroup><thead><tr><th rowspan="2">순위</th><th rowspan="2" class="name">참여자 <small>${ps.length}</small></th><th rowspan="2">누적</th>${groups.map(g=>`<th colspan="${g.n}">${g.m}월</th>`).join('')}</tr><tr>${ds.map(d=>`<th title="${d}${data.completedDates.includes(d)?' · 집계 완료':''}" class="${[0,6].includes(new Date(d+'T00:00:00').getDay())?'weekend':''} ${d===today?'today':''} ${data.completedDates.includes(d)?'complete':''}">${+d.slice(8)}${data.completedDates.includes(d)?'<span class="complete-label">완료</span>':''}</th>`).join('')}</tr></thead><tbody>${ps.map(p=>`<tr><td class="rank">${total(p.id)?1+totals.filter(n=>n>total(p.id)).length:'—'}</td><td class="name" title="${esc(p.name)}">${esc(p.name)}</td><td class="sum">${total(p.id)}</td>${ds.map(d=>{let a=data.records[d],yes=a?.includes(p.id);return `<td class="${yes?'yes':a?'no':d>today?'future':'pending'}" title="${esc(p.name)} · ${d} · ${yes?'인증 완료':a?'인증 없음':d>today?'예정':'집계 전'}">${yes?'✓':a?'—':d>today?'':'·'}</td>`}).join('')}</tr>`).join('')}</tbody>`;if(!ps.length)$('table').innerHTML='<caption class="empty">검색 결과가 없습니다.</caption>'}
$('metrics').innerHTML=[['참여자',data.participants.length,'명'],['누적 인증',Object.values(data.records).reduce((n,a)=>n+a.length,0),'회'],['집계 완료',data.completedDates.length,'일'],['11/9 인증',data.records['2026-11-09']?.length||0,'명']].map(([t,n,u])=>`<div class="metric"><span>${t}</span><b>${n}</b><span>${u}</span></div>`).join('');$('updated').textContent='마지막 반영 '+data.updatedAt+' · 한국 시간';$('search').oninput=render;$('sort').onchange=render;$('export').onclick=()=>{let rows=[['참여자','누적',...dates],...data.participants.map(p=>[p.name,total(p.id),...dates.map(d=>data.records[d]?data.records[d].includes(p.id)?1:0:'')])],csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='필사모임_참여기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();
